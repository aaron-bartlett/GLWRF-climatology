# Build the site and publish it to GitHub Pages on every push to main.
# Needs: Settings → Pages → Source "GitHub Actions", and a repository variable DATA_BASE_URL
# (Settings → Secrets and variables → Actions → Variables) holding the public R2 URL, no trailing slash.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Check DATA_BASE_URL is set
        run: test -n "${{ vars.DATA_BASE_URL }}" || { echo "Set the DATA_BASE_URL repository variable"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
